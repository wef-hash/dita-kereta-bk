    // ==========================================
    // AUDIO SYNTHESIZER (offline-friendly)
    // ==========================================
    const playSuccessChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Note 1
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);

        // Note 2
        setTimeout(() => {
          let osc2 = audioCtx.createOscillator();
          let gain2 = audioCtx.createGain();
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
          gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.45);
        }, 150);

        // Note 3
        setTimeout(() => {
          let osc3 = audioCtx.createOscillator();
          let gain3 = audioCtx.createGain();
          osc3.connect(gain3);
          gain3.connect(audioCtx.destination);
          osc3.type = 'sine';
          osc3.frequency.setValueAtTime(783.99, audioCtx.currentTime); // G5
          gain3.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain3.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc3.start();
          osc3.stop(audioCtx.currentTime + 0.55);
        }, 300);
      } catch (err) {
        console.log("Audio not supported or blocked: ", err);
      }
    };

    const playClickTone = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (err) {}
    };

    // ==========================================
    // STATION 1 (KENALI DIRIMU)
    // ==========================================
    function StationOne({ progress, onUpdate }) {
      const [stage, setStage] = useState('intro'); // intro, quiz1, quiz2, result
      const [answers, setAnswers] = useState({});
      const [questionIdx, setQuestionIdx] = useState(0);

      // Quiz 1: RIASEC questions
      const riasecQuestions = [
        { id: 1, text: "Saya suka merakit laptop, memperbaiki kabel, atau mengulik barang elektro.", category: "Realistic" },
        { id: 2, text: "Saya penasaran meneliti kandungan zat, memecahkan teka-teki logika, atau menganalisis data.", category: "Investigative" },
        { id: 3, text: "Saya senang melukis, menulis cerpen, mengedit video, atau mendesain grafis.", category: "Artistic" },
        { id: 4, text: "Saya menikmati menolong kawan curhat, mengajar adik kelas, atau menjadi relawan sosial.", category: "Social" },
        { id: 5, text: "Saya suka berdagang, menawarkan barang, dan memimpin diskusi koordinasi tim panitia.", category: "Enterprising" },
        { id: 6, text: "Saya menyukai tugas menata kearsipan data, membuat rincian anggaran bulanan secara rapi.", category: "Conventional" },
      ];

      // Quiz 2: Aptitude questions (Analis, Kreatif, Sosial, Praktis)
      const aptitudeQuestions = [
        { id: 1, text: "Menurutmu, cara terbaik menyelesaikan tugas sulit adalah:", options: [
          { text: "Membagi masalah jadi langkah keci, menganalisis jalannya data secara logis", trait: "Analis/Sistematis" },
          { text: "Menjelajah ide kreatif di luar kebiasaan, merancang gagasan unik baru", trait: "Kreatif/Inovatif" },
          { text: "Mengajak kolaborasi kelompok, berdiskusi dan berbagi tugas bersama", trait: "Sosial/Interpersonal" },
          { text: "Lakukan langsung prakteknya, fokus eksekusi nyata secepat mungkin", trait: "Praktis/Eksekutor" }
        ]}
      ];

      const startQuiz = () => {
        playClickTone();
        setStage('quiz1');
        setAnswers({});
        setQuestionIdx(0);
      };

      const handleRIASECAnswer = (score) => {
        playClickTone();
        const currentQ = riasecQuestions[questionIdx];
        const updatedAnswers = { ...answers, [currentQ.category]: score };
        setAnswers(updatedAnswers);

        if (questionIdx < riasecQuestions.length - 1) {
          setQuestionIdx(questionIdx + 1);
        } else {
          // Finish RIASEC, move to Quiz 2
          setStage('quiz2');
          setQuestionIdx(0);
        }
      };

      const handleAptitudeAnswer = (option) => {
        playClickTone();
        // Calc Results
        const maxCategory = Object.keys(answers).reduce((a, b) => answers[a] > answers[b] ? a : b, "Social");
        
        const nextProgress = {
          ...progress,
          currentStation: 2,
          stamps: { ...progress.stamps, 1: true },
          station1: {
            interestResults: {
              primary: maxCategory,
              description: getRIASECDesc(maxCategory)
            },
            aptitudeResults: {
              primary: option.trait,
              description: "Menunjukkan kakekatan cara bertindak dan merespon segala tantangan sehari-hari secara terencana."
            },
            completedInterest: true,
            completedAptitude: true
          }
        };
        onUpdate(nextProgress);
        playSuccessChime();
        setStage('result');
      };

      const getRIASECDesc = (cat) => {
        const descs = {
          "Realistic": "Fokus pada praktek fisik, teknikal, mekanikal, dan aktivitas langsung di lapangan kerja fisik.",
          "Investigative": "Tipe akademis yang senang riset analitikal, matematika rumit, sains, dan sains data komputer.",
          "Artistic": "Memiliki sensitivitas seni visual, literatur bahasa, musik, dan kebebasan berekspresi inovatif.",
          "Social": "Sangat senang mendampingi sesama, mengajar anak-anak, mengayomi, membimbing konseling, dan melayani publik.",
          "Enterprising": "Berjiwa wirausahawan kompetitif, lincah bernegosiasi bisnis, presentasi pidato kepemimpinan.",
          "Conventional": "Detail-oriented, tertib mengurusi berkas operasional kantor, pembukuan keuangan akuntansi, basis data."
        };
        return descs[cat] || "Potensi diri yang berharga untuk dikembangkan.";
      };

      if (stage === 'intro') {
        return (
          <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
              <Icon name="compass" class="w-6 h-6 text-amber-400" /> Stasiun 1: Mengenal Potensi Minat & Bakat
            </h2>
            <p class="text-xs text-slate-400">
              Sesaat lagi kita akan memulai penelusuran jati dirimu agar tidak tersesat dalam memilih jalan belajar. Kita akan menelusuri minat dominan berdasarkan struktur baku teori Holland (RIASEC) serta kematangan bakat bawaanmu!
            </p>
            <div class="p-4 bg-slate-950 border border-slate-850 rounded-xl">
              <p class="text-xs text-indigo-400 font-mono font-semibold">Tantangan Stasiun 1:</p>
              <ul class="text-[11px] text-slate-400 mt-2 list-disc pl-4 space-y-1">
                <li>Asesmen Kematangan Minat (RIASEC 6 Dimensi)</li>
                <li>Asesmen Kekuatan Bakat Respon Jati Diri</li>
                <li>Mendapatkan Stamp Sertifikasi Stasiun 1</li>
              </ul>
            </div>
            <button
              onClick={startQuiz}
              class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold py-3.5 rounded-xl transition text-xs font-display"
            >
              Mulai Asesmen Potensi Sekarang ⚡
            </button>
          </div>
        );
      }

      if (stage === 'quiz1') {
        const q = riasecQuestions[questionIdx];
        const progressPct = Math.round((questionIdx / riasecQuestions.length) * 100);
        return (
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6">
            <div class="flex justify-between items-center border-b border-sidebar border-slate-800 pb-3">
              <span class="text-slate-450 font-bold font-mono text-[10px] uppercase">Langkah 1: Kuis Minat Jati Diri</span>
              <span class="text-amber-500 font-bold font-mono text-xs">{questionIdx + 1} / {riasecQuestions.length}</span>
            </div>
            <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden">
              <div class="h-full bg-amber-500 rounded-full" style={{ width: `${progressPct}%` }} />
            </div>
            <div class="text-center py-4">
              <p class="text-lg font-bold text-white select-none">"{q.text}"</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <button
                onClick={() => handleRIASECAnswer(1)}
                class="bg-slate-950 hover:bg-red-500/10 border border-slate-800 hover:border-red-500/30 text-slate-350 p-4 rounded-xl text-xs font-semibold"
              >
                ✖ Sangat Tidak Suka / Tidak Setuju
              </button>
              <button
                onClick={() => handleRIASECAnswer(3)}
                class="bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-350 p-4 rounded-xl text-xs font-semibold"
              >
                — Biasa Saja
              </button>
              <button
                onClick={() => handleRIASECAnswer(5)}
                class="bg-slate-950 hover:bg-emerald-500/10 border border-slate-800 hover:border-emerald-500/30 text-emerald-400 p-4 rounded-xl text-xs font-bold"
              >
                ✔ Sangat Suka / Sangat Setuju
              </button>
            </div>
          </div>
        );
      }

      if (stage === 'quiz2') {
        const q = aptitudeQuestions[questionIdx];
        return (
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6">
            <div>
              <span class="text-indigo-400 font-bold font-mono text-[10px] uppercase block">Langkah 2: Profiling Kemampuan Kerja</span>
              <h3 class="text-base font-bold text-white mt-1">{q.text}</h3>
            </div>
            <div class="space-y-3">
              {q.options.map((opt, idx) => (
                <button
                  key={idx}
                  onClick={() => handleAptitudeAnswer(opt)}
                  class="w-full bg-slate-950 hover:bg-slate-850 p-4 border border-slate-850 hover:border-slate-700 text-left rounded-xl text-xs font-semibold text-slate-200 transition"
                >
                  {opt.text}
                </button>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-6">
          <div class="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto text-emerald-400">
            <Icon name="check-circle" className="w-10 h-10 mx-auto" />
          </div>
          <div>
            <h3 class="text-xl font-bold text-white">Asesmen Stasiun 1 Selesai! 🎉</h3>
            <p class="text-xs text-slate-400 mt-2 max-w-sm mx-auto">
              Satu stempel penghargaan telah dicap manis pada tiket perjalananmu! Berikut profil dirimu:
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-md mx-auto text-left">
            <div class="bg-slate-955/60 p-4 rounded-xl border border-slate-850">
              <span class="text-[9px] uppercase font-mono font-bold text-amber-500">Kategori Minat</span>
              <h4 class="text-base font-extrabold text-white mt-1">{progress.station1.interestResults?.primary}</h4>
              <p class="text-[10px] text-slate-400 leading-normal mt-1">{progress.station1.interestResults?.description}</p>
            </div>
            <div class="bg-slate-955/60 p-4 rounded-xl border border-slate-850">
              <span class="text-[9px] uppercase font-mono font-bold text-emerald-400">Gaya Bakat Utama</span>
              <h4 class="text-base font-extrabold text-white mt-1">{progress.station1.aptitudeResults?.primary}</h4>
              <p class="text-[10px] text-slate-400 leading-normal mt-1">{progress.station1.aptitudeResults?.description}</p>
            </div>
          </div>

          <div class="pt-4 max-w-md mx-auto">
            <button
              onClick={() => {
                playClickTone();
                setStage('intro');
              }}
              class="text-indigo-400 hover:text-indigo-300 font-bold text-xs"
            >
              Ulangi Tes Kepribadian 🔄
            </button>
          </div>
        </div>
      );
    }


    // ==========================================
    // STATION 2 (KELOLA EMOSI)
    // ==========================================
    function StationTwo({ progress, onUpdate }) {
      const [mood, setMood] = useState('biasa');
      const [journalText, setJournalText] = useState('');
      const [aiResponse, setAiResponse] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const moodFaces = [
        { id: 'sangat_senang', label: '🌻 Sangat Bahagia', color: 'bg-amber-500/15 border-amber-500/40 text-amber-400' },
        { id: 'senang', label: '🙂 Senang/Gembira', color: 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400' },
        { id: 'biasa', label: '😐 Tenang/Biasa', color: 'bg-slate-500/15 border-slate-500/40 text-slate-400' },
        { id: 'sedih', label: '😢 Sedih/Gundah', color: 'bg-sky-500/15 border-sky-500/40 text-sky-400' },
        { id: 'marah', label: '😡 Kesal/Marah', color: 'bg-rose-500/15 border-rose-500/40 text-rose-400' },
      ];

      const handleMoodLog = (selectedId) => {
        playClickTone();
        setMood(selectedId);
      };

      const handleAnalyzeJournal = (e) => {
        e.preventDefault();
        if (!journalText.trim()) return;
        
        setIsAnalyzing(true);
        playClickTone();

        // Local smart Counselor algorithm simulating Gemini AI
        setTimeout(() => {
          const textLower = journalText.toLowerCase();
          let dominantEmotion = moodFaces.find(m => m.id === mood)?.label || "Biasa Saja";
          let sentiment = "Netral";
          let advice = "Terima kasih sudah mencurahkan isi hatimu. Setiap helaan keluh kesahmu berharga.";

          if (textLower.includes("stres") || textLower.includes("lelah") || textLower.includes("capek") || textLower.includes("berat") || textLower.includes("sulit")) {
            sentiment = "Negatif / Tertekan";
            advice = "Wajar bila adakalanya pundak terasa lelah, kawan. Sisihkan jeda sesaat, tarik napas dalam, dan yakini bahwa beban ini hanyalah bagian dari pelangi yang akan datang. Hubungi guru BK bila kamu butuh teman bimbingan.";
          } else if (textLower.includes("senang") || textLower.includes("bahagia") || textLower.includes("syukur") || textLower.includes("bangga") || textLower.includes("berhasil")) {
            sentiment = "Sangat Positif";
            advice = "Luar biasa! Pertahankan energi positif ini. Bagikan kebahagiaanmu ke orang di sekeliling agar sinarmu mencerahkan dunia mereka juga.";
          } else if (textLower.includes("marah") || textLower.includes("benci") || textLower.includes("kesal") || textLower.includes("iri") || textLower.includes("berantem")) {
            sentiment = "Campuran / Defensif";
            advice = "Rasa amarah adalah alarm alami tubuh bahwa ada batasanmu yang sedang diganggu. Duduklah santai, minum air putih, dan bicarakan ini baik-baik tanpa emosi yang meledak.";
          } else if (textLower.includes("bully") || textLower.includes("kasar") || textLower.includes("diejek") || textLower.includes("sendiri")) {
            sentiment = "Terancam / Butuh Perhatian";
            advice = "Kamu sangat aman di platform ini. Ingat, kamu tidak pernah sendiri menghadapi ejekan! Segera laporkan perlakuan kurang mengenakkan ini di Stasiun 3 atau temui Konselor BK di sekolah secepatnya.";
          } else {
            sentiment = "Stabil / Tenang";
            advice = "Membiasakan menuangkan pikiran dalam tulisan adalah cara paling sehat untuk menjaga kewaspadaan mental spiritualmu. Teruskan kebiasaan baik ini!";
          }

          const analysis = {
            sentiment,
            dominantEmotion,
            advice,
            keywords: textLower.split(/\s+/).filter(w => w.length > 4).slice(0, 4)
          };

          const newProg = {
            ...progress,
            currentStation: 3,
            stamps: { ...progress.stamps, 2: true },
            station2: {
              moodLogs: [
                ...(progress.station2?.moodLogs || []),
                { id: `mood-${Date.now()}`, mood: mood, text: "Dicatat di Stasiun 2", date: new Date().toLocaleDateString('id-ID') }
              ],
              journalEntries: [
                ...(progress.station2?.journalEntries || []),
                { id: `jrn-${Date.now()}`, content: journalText, date: new Date().toLocaleDateString('id-ID'), analysis }
              ]
            }
          };

          onUpdate(newProg);
          setAiResponse(analysis);
          setIsAnalyzing(false);
          playSuccessChime();
        }, 1200);
      };

      return (
        <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-6" id="station-2-panel">
          <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
              <Icon name="smile" class="w-6 h-6 text-emerald-400" /> Stasiun 2: Kelola Emosi & AI Jurnal Counselor
            </h2>
            <p class="text-xs text-slate-450 mt-1">
              Setiap laju lokomotif membutuhkan pembakaran uap yang seimbang. Catat rona perasaanmu hari ini dan ketikkan curhatan hatimu untuk dianalisis oleh AI Counselor!
            </p>
          </div>

          <div class="space-y-4">
            <h4 class="text-xs font-bold text-slate-300">1. Bagaimana suasana hatimu saat ini?</h4>
            <div class="flex flex-wrap gap-2.5">
              {moodFaces.map((item) => (
                <button
                  key={item.id}
                  onClick={() => handleMoodLog(item.id)}
                  type="button"
                  class={`py-2.5 px-4 rounded-xl text-xs font-semibold border transition ${
                    mood === item.id 
                      ? 'bg-indigo-600 border-indigo-400 text-white shadow-md' 
                      : `${item.color} bg-slate-950 hover:opacity-100 opacity-70`
                  }`}
                >
                  {item.label}
                </button>
              ))}
            </div>
          </div>

          <form onSubmit={handleAnalyzeJournal} class="space-y-3 pt-2">
            <h4 class="text-xs font-bold text-slate-300">2. Jurnal BK (Tulis apa saja yang sedang berkecamuk di dalam pikiranmu):</h4>
            <textarea
              placeholder="Contoh: Saya akhir-akhir ini merasa sangat lelah belajar dan takut ulangan mtk di sekolah..."
              value={journalText}
              onChange={(e) => setJournalText(e.target.value)}
              class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-emerald-500 h-28"
              maxLength={1000}
            />

            <button
              type="submit"
              disabled={isAnalyzing || !journalText.trim()}
              class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider font-display transition"
            >
              {isAnalyzing ? 'Mengevaluasi Jurnal Dengan Counselor AI ...' : 'Minta Analisis & Nasehat AI Counselor ⚡'}
            </button>
          </form>

          {aiResponse && (
            <div class="bg-indigo-950/20 border border-indigo-500/20 p-5 rounded-2xl space-y-3 animate-fade-in">
              <div class="flex items-center gap-2 border-b border-indigo-500/10 pb-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" />
                <h4 class="text-xs font-bold text-indigo-400 uppercase tracking-wider font-mono">Hasil Analisis Diagnostik Jurnal Siswa</h4>
              </div>

              <div class="space-y-1.5 text-xs text-slate-300">
                <p>🎭 Sentimen Pikiran: <strong class="text-white">{aiResponse.sentiment}</strong></p>
                <p>💖 Dominan Mood: <strong class="text-white">{aiResponse.dominantEmotion}</strong></p>
                <div class="mt-2 text-[11px] bg-slate-950/80 border border-slate-800 p-3 rounded-xl italic">
                  <span class="text-emerald-400 font-bold block not-italic mb-1">Wejangan Guru Konselor BK:</span>
                  "{aiResponse.advice}"
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }


    // ==========================================
    // STATION 3 (HUBUNGAN SOSIAL)
    // ==========================================
    function StationThree({ progress, onUpdate }) {
      const [signed, setSigned] = useState(progress.station3?.pledgeSigned || false);
      const [signatureText, setSignatureText] = useState(progress.name || '');
      const [score, setScore] = useState(0);
      const [currentQ, setCurrentQ] = useState(0);

          ...progress,
          currentStation: 4,
          stamps: { ...progress.stamps, 3: true },

            bullyingCompleted: true,

              <div class="space-y-2 pt-2">
                {scenarios[currentQ].options.map((opt, idx) => (
                  <button

                  "Saya berjanji dengan segenap kesadaran nurani untuk menolak segala rupa perundungan (bullying) fisik, verbal, maupun cyber di lingkungan belajar, sekolah, dan internet demi menjaga kedamaian rukun pertemanan."

                <h3 class="text-md font-bold text-white">Ikrar Deklarasi Berhasil Ditandatangani! 🎉</h3>
                <p class="text-xs text-slate-500 font-mono mt-1">Dicatat pada: {progress.station3?.pledgeDate || new Date().toLocaleDateString('id-ID')}</p>

      const handleOptionClick = (opt) => {
        playClickTone();
        const updatedAns = [...answers, opt.field];

        if (currQ < careerQuestions.length - 1) {
          setCurrQ(currQ + 1);
        } else {
          // Process major
          const counts = {};
          let maxField = "sains_teknologi";
          let maxCount = 0;

          [...updatedAns].forEach((field) => {

            if (counts[field] > maxCount) {
              maxCount = counts[field];
              maxField = field;
            }
          });

          const resultPayload = getMajorByField(maxField);
          const nextProg = {
            ...progress,
            currentStation: 5,
            stamps: { ...progress.stamps, 4: true },
            station4: {
              completedMajorTest: true,
              majorResult: resultPayload,
              selectedJobSector: maxField
            }
          };

          onUpdate(nextProg);
          setStage('result');
          playSuccessChime();
        }

      const getMajorByField = (field) => {
        const majors = {
          "sains_teknologi": {
            title: "Sains, Sistem Informasi, & Teknologi (STEM)",
            description: "Memecahkan kebuntuan peradaban menggunakan pemetaan riset algoritma koding sistematis.",
            jobs: ["Software Engineering", "AI Engineer", "Cyber Security", "Sains Data Analyst"]

          "sosial_humaniora5": {

            jobs: ["UX Designer", "Illustrator Animasi", "Screenwriter Film", "Game Designer"]
          },
          "jasa_bisnis": {
            title: "Manajemen Bisnis Keuangan, Akuntansi & Logistik Kereta",
            description: "Mengoptimalkan arus modal perdagangan lintas digital nasional.",
            jobs: ["Digital Marketer", "Akuntan Publik", "CEO Startup Founder", "Manajer Logistik Kereta"]
          }
        };
        return majors[field] || majors["sains_teknologi"];
      };

      if (stage === 'intro') {
        return (
          <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">

            >
              Mulai Pemfilteran Karier Sekarang ⚡
            </button>
          </div>
        );

      if (stage === 'quiz') {

        return (
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">

            <div class="space-y-2.5 pt-2">
              {q.options.map((opt, idx) => (
                <button
                  key={idx}
                  onClick={() => handleOptionClick(opt)}
                  class="w-full bg-slate-950 hover:bg-slate-850 p-4 border border-slate-850 text-left text-xs font-semibold text-slate-300 rounded-xl transition"
                >
                  {opt.text}
                </button>
              ))}

      }

      return (
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-6">
          <Icon name="award" class="w-12 h-12 text-indigo-400 mx-auto" />
          <div>
            <h3 class="text-lg font-bold text-white">Peta Lintasan Kariermu Terbuka! 🎓</h3>
            <p class="text-xs text-slate-400 font-mono mt-1">Stempel ke-4 berhasil tersemat indah</p>

              <p class="text-[11px] text-slate-400 mt-1">{progress.station4.majorResult?.description || "Melatih nalar logika pemecahan masalah."}</p>

                    ★ {job}
                  </span>

              </div>
            </div>
          </div>
        </div>
      );
    }


    // ==========================================
    // STATION 5 (MASA DEPAN / GOALS)
    // ==========================================
    function StationFive({ progress, onUpdate }) {
      const [goals, setGoals] = useState(progress.station5?.goals || []);
      const [newGoalText, setNewGoalText] = useState('');
      const [goalType, setGoalType] = useState('short');
      const [goalYear, setGoalYear] = useState('2026');

      const handleAddGoal = (e) => {
        e.preventDefault();
        if (!newGoalText.trim()) return;

        playClickTone();
        const freshGoal = {
          id: `goal-${Date.now()}`,
          type: goalType,
          text: newGoalText.trim(),
          targetYear: goalType === 'dream' ? 'Abadi' : goalYear,
          completed: false
        };

        const updatedGoals = [...goals, freshGoal];
        setGoals(updatedGoals);
        setNewGoalText('');

        const nextProg = {
          ...progress,
          station5: {
            ...progress.station5,
            goals: updatedGoals
          }
        };
        onUpdate(nextProg);
      };

      const handleToggleGoal = (id) => {
        playClickTone();
        const updated = goals.map(g => g.id === id ? { ...g, completed: !g.completed } : g);
        setGoals(updated);

        const nextProg = {
          ...progress,
          station5: {
            ...progress.station5,
            goals: updated
          }
        };
        onUpdate(nextProg);
      };

      const handleDeleteGoal = (id) => {
        playClickTone();
        const updated = goals.filter(g => g.id !== id);
        setGoals(updated);

        const nextProg = {
          ...progress,
          station5: {
            ...progress.station5,
            goals: updated
          }
        };
        onUpdate(nextProg);
      };

        playClickTone();
        const next = {
          ...progress,
          currentStation: 5,
          stamps: { ...progress.stamps, 5: true },
          station5: {
            goals: goals,
            completedJourney: true

                "Rel yang terbujur bukanlah sekedar jalan lurus, melainkan titian takdir dan mimpi muliamu. Teruslah berjalan dengan gagah!"
              </div>

              <div class="pt-4 flex justify-center gap-3">
                <button
                  onClick={() => window.print()}
                  class="bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold text-xs py-2.5 px-6 rounded-xl transition"
                >
                  Cetak Piagam Kelulusan 🖨
                </button>
                <button
                  onClick={() => {
                    playClickTone();
                    const fresh = { ...progress };
                    fresh.station5.completedJourney = false;
                    onUpdate(fresh);
                  }}
                  class="text-xs text-slate-550 hover:text-slate-300 font-semibold"
                >
                  Edit Sasaran Impian 📋
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }


    // ==========================================
    // GURU / COUNSELOR MONITORING DASHBOARD
    // ==========================================
    function GuruDashboard({ onBackToApp }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [students, setStudents] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [stationFilter, setStationFilter] = useState('all');
      const [selectedStudent, setSelectedStudent] = useState(null);

      // Local storage student logs
      const loadLocalSinks = () => {
        try {
          const registered = localStorage.getItem('kereta_bk_progress');
          const list = [];
          if (registered) {
            list.push(JSON.parse(registered));
          }
          return list;
        } catch (err) {
          return [];
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          const loaded = loadLocalSinks();
          setStudents(loaded);
        }
      }, [isAuthenticated]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '1234' || pinInput.toLowerCase() === 'guru') {
          setIsAuthenticated(true);
          setAuthError('');
          playSuccessChime();
        } else {
          setAuthError('Pin salah! Gunakan: "1234" atau "guru"');
        }
      };

      const handlePreseedMockData = () => {
        playSuccessChime();
        const mocks = [
          {
            ticketId: "BK-TR-8724",
            name: "Ahmad Reynaldi",
            currentStation: 5,
            stamps: { 1: true, 2: true, 3: true, 4: true, 5: true },
            station1: {
              interestResults: { primary: "Realistic", description: "Menyukai kerja praktikal fisik lapangan rona mekanikal." },
              aptitudeResults: { primary: "Praktis/Eksekutor", description: "Lakukan eksekusi langsung tindakan fisik cepat." }
            },
            station2: {
              moodLogs: [{ id: "m-1", mood: "senang", text: "Senang koding sederhana", date: "09/06/2026" }],
              journalEntries: [{ id: "j-1", content: "Kepikiran membuat software pendeteksi mood BK yang bisa membantuku merawat relasi dengan kawan.", analysis: { sentiment: "Sangat Positif", dominantEmotion: "🙂 Senang", advice: "Pertahankan ketekunanmu!" } }]
            },
            station3: { pledgeSigned: true, pledgeDate: "09/06/2026" },
            station4: { completedMajorTest: true, majorResult: { title: "Sains & Teknologi (STEM)", description: "Berpikir logis.", jobs: ["Engineer", "Analyst"] } },
            station5: { goals: [{ text: "Lulus ujian MTK", type: "short", completed: true }, { text: "Kuliah IT", type: "long", completed: false }] }
          },
          {
            ticketId: "BK-TR-4299",
            name: "Siti Rahmawati",
            currentStation: 3,
            stamps: { 1: true, 2: true, 3: true },
            station1: {
              interestResults: { primary: "Social", description: "Senang berjejaring dan merawat ikatan rukun pertemanan sesama sipil." }
            },
            station2: {
              moodLogs: [{ id: "m-2", mood: "sedih", text: "Kucing sakit tadi pagi", date: "09/06/2026" }],
              journalEntries: [{ id: "j-2", content: "Saya merasa sedih sekali karena tadi dibilang malas oleh kawan sebelah bangku.", analysis: { sentiment: "Terancam / Butuh Perhatian", dominantEmotion: "😢 Sedih", advice: "Jangan bersedih Siti, konselor BK siap menjagamu." } }]
            },
            station3: { pledgeSigned: true, pledgeDate: "09/06/2026" },
            station4: { completedMajorTest: false },
            station5: { goals: [] }
          }
        ];

        // Merge with current list
        const currentList = loadLocalSinks();
        setStudents([...currentList, ...mocks]);
      };

      const handleClear = () => {
        if (confirm("Kosongkan data pancingan (mock) dashboard ini?")) {
          setStudents(loadLocalSinks());
          setSelectedStudent(null);
          playClickTone();
        }
      };

      const filtered = students.filter(s => {
        const matchesS = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.ticketId.includes(searchTerm);
        const matchesSt = stationFilter === 'all' || s.currentStation === Number(stationFilter);
        return matchesS && matchesSt;
      });

      if (!isAuthenticated) {
        return (
          <div class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6" id="guru-login-panel">
            <div class="text-center space-y-2">
              <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
                <Icon name="lock" className="w-6 h-6 text-indigo-400" />
              </div>
              <h2 class="text-xl font-bold text-white font-display">Gerbang Akses Dasbor Guru BK</h2>
              <p class="text-xs text-slate-400 font-sans">
                Gunakan panel konselor ini untuk memantau rona emosi, bakat minat, dan sasaran mawas siswa kelas Anda.
              </p>
            </div>

            <form onSubmit={handleLogin} class="space-y-4">
              <div>
                <label class="block text-xs uppercase tracking-wider font-mono font-bold text-slate-500 mb-1.5">
                  Masukkan PIN Akses Guru:
                </label>
                <input
                  type="password"
                  placeholder="PIN: ketik '1234' atau 'guru'"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-center font-mono"
                  autoFocus
                />
                {authError && (
                  <p class="text-red-500 text-xs mt-1.5 font-semibold text-center animate-pulse">
                    {authError}
                  </p>
                )}
              </div>

              <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-xs transition uppercase font-display"
              >
                Buka Monitor Konselor ⚡
              </button>
            </form>

            <div class="text-center border-t border-slate-800 pt-4">
              <button onClick={onBackToApp} class="text-xs text-slate-550 hover:text-slate-355 font-semibold">
                Kembali ke Kereta Siswa 🚂
              </button>
            </div>
          </div>
        );
      }

      return (
        <div class="space-y-6 animate-fade-in">
          {/* Header Banner */}
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-slate-900 p-6 border border-slate-800 rounded-3xl">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center font-extrabold font-mono text-lg">
                BK
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-lg font-black text-white font-display">Monitoring Konseling Siswa Terpadu</h2>
                  <span class="bg-rose-500/10 text-rose-400 text-[10px] font-mono px-2 py-0.5 rounded border border-rose-500/20 font-bold">
                    PREVIEW MODE
                  </span>
                </div>
                <p class="text-xs text-slate-450 mt-0.5">Memantau jurnal, mood, dan target rencana sasaran murid secara real-time.</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button 
                onClick={handlePreseedMockData} 
                class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 hover:bg-indigo-500/20 px-3.5 py-1.5 rounded-xl text-xs font-bold transition"
              >
                + Tambah Contoh Siswa
              </button>
              {students.length > 0 && (
                <button onClick={handleClear} class="p-2 border border-slate-800 hover:border-red-500/20 hover:text-red-400 rounded-xl transition">
                  <Icon name="trash-2" className="w-4 h-4" />
                </button>
              )}
              <button onClick={onBackToApp} class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">
                Kembali 🚂
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* List */}
            <div class="lg:col-span-7 bg-slate-905 bg-slate-900/60 border border-slate-800 p-5 rounded-2xl space-y-4">
              <h3 class="text-xs uppercase tracking-wider font-mono font-bold text-slate-400 flex items-center gap-1.5">
                <Icon name="file-spreadsheet" className="w-4 h-4 text-indigo-400" /> Daftar Siswa / Penumpang ({students.length})
              </h3>

              <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                <div class="sm:col-span-8 relative">
                  <input
                    type="text"
                    placeholder="Cari nama atau tiket siswa..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-3 pr-3 py-1.5 text-xs text-slate-100"
                  />
                </div>
                <div class="sm:col-span-4 bg-slate-950 border border-slate-800 px-2 rounded-lg flex items-center">
                  <select
                    value={stationFilter}
                    onChange={(e) => setStationFilter(e.target.value)}
                    class="bg-transparent text-xs text-slate-300 w-full focus:outline-none cursor-pointer"
                  >
                    <option value="all">Semua Stasiun</option>
                    <option value="1">Stasiun 1</option>
                    <option value="2">Stasiun 2</option>
                    <option value="3">Stasiun 3</option>
                    <option value="4">Stasiun 4</option>
                    <option value="5">Stasiun 5</option>
                  </select>
                </div>
              </div>

              <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
                {filtered.map((stud) => {
                  const stampCount = Object.values(stud.stamps || {}).filter(Boolean).length;
                  const isSelect = selectedStudent?.ticketId === stud.ticketId;
                  return (
                    <div
                      key={stud.ticketId}
                      onClick={() => setSelectedStudent(stud)}
                      class={`p-4 border rounded-xl flex items-center justify-between gap-3 cursor-pointer transition ${
                        isSelect ? 'bg-indigo-950/20 border-indigo-500/50' : 'bg-slate-950/60 border-slate-850 hover:border-slate-800'
                      }`}
                    >
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="text-[10px] font-mono bg-slate-900 border border-slate-800 px-1.5 py-0.2 rounded text-amber-400">
                            {stud.ticketId}
                          </span>
                          <h4 class="text-xs font-extrabold text-white">{stud.name}</h4>
                        </div>
                        <p class="text-[10px] text-slate-500 font-mono mt-1">
                          Posisi: Stasiun {stud.currentStation}/5 • <span class="text-emerald-400 font-bold">{stampCount} Stempel</span>
                        </p>
                      </div>

                      <button class="text-[10px] font-bold bg-slate-900 border border-slate-800 text-indigo-400 px-2.5 py-1 rounded hover:bg-slate-800">
                        Evaluasi
                      </button>
                    </div>
                  );
                })}

                {filtered.length === 0 && (
                  <div class="text-center py-12 text-slate-500 text-xs italic">
                    Belum ada siswa penjelajah. Tekan "+ Tambah Contoh Siswa" untuk demonstrasi data penuh!
                  </div>
                )}
              </div>
            </div>

            {/* Inspect viewer */}
            <div class="lg:col-span-5 bg-slate-900/60 border border-slate-800 p-5 rounded-2xl min-h-[400px]">
              {selectedStudent ? (
                <div class="space-y-4">
                  <div class="border-b border-slate-800 pb-3">
                    <span class="text-[9px] font-mono uppercase bg-amber-500/10 text-amber-400 px-2.5 py-0.5 rounded-full border border-amber-500/20 font-bold">
                      {selectedStudent.ticketId}
                    </span>
                    <h3 class="text-sm font-extrabold text-white mt-1.5 font-display">{selectedStudent.name}</h3>
                    <p class="text-[10px] text-indigo-400 font-mono">Posisi Lapangan: Kereta Stasiun {selectedStudent.currentStation}</p>
                  </div>

                  <div class="space-y-3 shrink-0">
                    {/* S1 */}
                    <div class="bg-slate-950/80 p-3 border border-slate-850 rounded-xl space-y-1">
                      <h4 class="text-[10px] font-mono tracking-wider text-amber-400 font-bold uppercase">Stasiun 1: Minat Holland (RIASEC)</h4>
                      {selectedStudent.station1?.interestResults ? (
                        <p class="text-xs font-semibold text-slate-200">💎 Dominan: {selectedStudent.station1.interestResults.primary}</p>
                      ) : (
                        <p class="text-[10px] text-slate-600 italic">Belum dikerjakan oleh siswa.</p>
                      )}
                    </div>

                    {/* S2 */}
                    <div class="bg-slate-950/80 p-3 border border-slate-850 rounded-xl space-y-1">
                      <h4 class="text-[10px] font-mono tracking-wider text-emerald-400 font-bold uppercase">Stasiun 2: Rona Emosi & Jurnal AI</h4>
                      {selectedStudent.station2?.journalEntries?.length > 0 ? (
                        <div class="space-y-1 font-sans text-[10px]">
                          <p class="italic text-slate-400">"{selectedStudent.station2.journalEntries[0].content}"</p>
                          {selectedStudent.station2.journalEntries[0].analysis && (
                            <p class="text-indigo-400">Sentimen AI: <strong class="text-white">{selectedStudent.station2.journalEntries[0].analysis.sentiment}</strong></p>
                          )}
                        </div>
                      ) : (
                        <p class="text-[10px] text-slate-650 italic">Belum mengunggah log jurnal malam.</p>
                      )}
                    </div>

                    {/* S3 */}
                    <div class="bg-slate-950/80 p-3 border border-slate-850 rounded-xl space-y-1">
                      <h4 class="text-[10px] font-mono tracking-wider text-sky-450 font-bold uppercase">Stasiun 3: Ikrar Rukun Damai</h4>
                      {selectedStudent.station3?.pledgeSigned ? (
                        <span class="text-[10px] text-emerald-400 font-mono font-semibold">✔ IKRAR TELAH DITANDA TANGANI</span>
                      ) : (
                        <span class="text-[10px] text-slate-650 italic">Belum menyerahkan tanda tangannya.</span>
                      )}
                    </div>

                    {/* S5 */}
                    <div class="bg-slate-950/80 p-3 border border-slate-850 rounded-xl space-y-1">
                      <h4 class="text-[10px] font-mono tracking-wider text-pink-400 font-bold uppercase">Stasiun 5: Goals & Sasaran</h4>
                      {selectedStudent.station5?.goals?.length > 0 ? (
                        <div class="space-y-0.5 text-[10px]">
                          {selectedStudent.station5.goals.map((g, i) => (
                            <div key={i} class="text-slate-300">★ {g.text} ({g.completed ? 'Selesai' : 'Aktif'})</div>
                          ))}
                        </div>
                      ) : (
                        <span class="text-[10px] text-slate-655 italic">Belum melampirkan resolusi impian tahunan.</span>
                      )}
                    </div>
                  </div>
                </div>
              ) : (
                <div class="text-center py-20 text-slate-500 font-mono text-xs">
                  *Pilih salah satu siswa di sebelah kiri untuk melihat evaluasi diagnostic BK mereka secara terperinci.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }


    // ==========================================
    // MAIN APP WRAPPER
    // ==========================================
    function App() {
      const [progress, setProgress] = useState(null);
      const [isGuruMode, setIsGuruMode] = useState(false);
      const [currentTime, setCurrentTime] = useState('');

      useEffect(() => {
        // Hydrate
        try {
          const saved = localStorage.getItem('id_bk_exp_single');
          if (saved) {
            setProgress(JSON.parse(saved));
          }
        } catch (err) {}

        // Set interval clock
        const timer = setInterval(() => {
          const now = new Date();
          setCurrentTime(now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB');
        }, 1000);

        return () => clearInterval(timer);
      }, []);

      const handleBoard = (name, ticketId) => {
        const initial = {
          name,
          ticketId,
          currentStation: 1,
          stamps: { 1: false, 2: false, 3: false, 4: false, 5: false },
          station1: { completedInterest: false, completedAptitude: false },
          station2: { moodLogs: [], journalEntries: [] },
          station3: { bullyingCompleted: false, pledgeSigned: false },
          station4: { completedMajorTest: false },
          station5: { goals: [], completedJourney: false }
        };
        setProgress(initial);
        localStorage.setItem('id_bk_exp_single', JSON.stringify(initial));
      };

      const handleUpdateProgress = (updated) => {
        setProgress(updated);
        localStorage.setItem('id_bk_exp_single', JSON.stringify(updated));
        
        // Also update counselor pool if synced in browser memory
        localStorage.setItem('kereta_bk_progress', JSON.stringify(updated));
      };

      const handleReset = () => {
        if (confirm("Reset ulang tiket perjalanan BK siswa saat ini?")) {
          setProgress(null);
          localStorage.removeItem('id_bk_exp_single');
          playClickTone();
        }
      };

      const activeComponent = () => {
        if (!progress) return null;
        switch (progress.currentStation) {
          case 1: return <StationOne progress={progress} onUpdate={handleUpdateProgress} />;
          case 2: return <StationTwo progress={progress} onUpdate={handleUpdateProgress} />;
          case 3: return <StationThree progress={progress} onUpdate={handleUpdateProgress} />;
          case 4: return <StationFour progress={progress} onUpdate={handleUpdateProgress} />;
          case 5: return <StationFive progress={progress} onUpdate={handleUpdateProgress} />;
          default: return <StationOne progress={progress} onUpdate={handleUpdateProgress} />;
        }
      };

      return (
        <div class="flex flex-col min-h-screen">
          {/* Navigation Bar Header */}
          <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 relative z-30 shadow-md">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div class="flex items-center gap-2.5">
                <div class="bg-amber-500/10 text-amber-400 p-2 rounded-xl border border-amber-500/20">
                  <Icon name="train" className="w-5 h-5 text-amber-404" />
                </div>
                <div>
                  <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5 font-display">
                    B-Express <span class="text-[9px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.2 rounded font-mono font-bold">ALL-IN-ONE</span>
                  </h1>
                  <p class="text-[10px] text-slate-500 font-sans tracking-wide">Bimbingan & Konseling Mandiri</p>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-1.5 text-[10px] font-mono text-slate-450 bg-slate-950 border border-slate-850 px-3 py-1.5 rounded-xl">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                  {currentTime || '08:00:00 WIB'}
                </div>

                <button
                  onClick={() => {
                    playClickTone();
                    setIsGuruMode(!isGuruMode);
                  }}
                  class="text-xs bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 px-3.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1 font-display uppercase tracking-wider"
                >
                  <Icon name="layout-dashboard" className="w-3.5 h-3.5" />
                  {isGuruMode ? 'Mode Kereta Siswa' : 'Dasbor Guru 📊'}
                </button>

                {progress && !isGuruMode && (
                  <button
                    onClick={handleReset}
                    class="text-xs text-slate-500 hover:text-red-400 font-bold transition flex items-center gap-1"
                  >
                    Reset Tiket 🔄
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Area */}
          <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 relative z-20">
            {isGuruMode ? (
              <GuruDashboard onBackToApp={() => setIsGuruMode(false)} />
            ) : !progress ? (
              <div class="space-y-6">
                <TicketBooth onBoard={handleBoard} />
                <div class="text-center">
                  <button
                    onClick={() => {
                      playClickTone();
                      setIsGuruMode(true);
                    }}
                    class="bg-slate-900 hover:bg-slate-850 border border-slate-800 text-indigo-400 text-xs py-2 px-4 rounded-xl transition"
                  >
                    Masuk Sebagai Guru / Konselor Sekolah 🔑
                  </button>
                </div>
              </div>
            ) : (
              <div class="space-y-6">
                <TrainMap
                  currentStation={progress.currentStation}
                  stamps={progress.stamps}
                  onSelectStation={(id) => {
                    const fresh = { ...progress, currentStation: id };
                    setProgress(fresh);
                    localStorage.setItem('id_bk_exp_single', JSON.stringify(fresh));
                  }}
                  ticketId={progress.ticketId}
                  userName={progress.name}
                />
                
                <div class="bg-slate-900/40 border border-slate-800/60 backdrop-blur-sm p-2 rounded-2xl">
                  {activeComponent()}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // React DOM Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
